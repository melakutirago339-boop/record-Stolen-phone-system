
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Phone - Stolen Phone System</title>

   
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    .message {
    padding: 14px 16px;
    margin-bottom: 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
}

.message.error {
    color: #991b1b;
    background: #fef2f2;
    border: 1px solid #fecaca;
}

.message.success {
    color: #166534;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
}
    :root {
        --navy: #102747;
        --blue: #1769aa;
        --blue-dark: #10558e;
        --page: #f2f6fc;
        --border: #dce5f0;
        --text: #253449;
        --muted: #68788d;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #edf3fa, #f8faff);
        color: var(--text);
        line-height: 1.6;
    }

    .navbar {
        background: linear-gradient(110deg, #0b1e38, #173d68);
        color: white;
        padding: 18px 5%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        box-shadow: 0 4px 18px rgba(9, 30, 60, 0.16);
    }

    .navbar h2 {
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 0.2px;
    }

    .back {
        color: white;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.3);
        padding: 10px 17px;
        border-radius: 9px;
        font-size: 14px;
        font-weight: 600;
        transition: background 0.2s, transform 0.2s;
    }

    .back:hover {
        background: rgba(255, 255, 255, 0.23);
        transform: translateY(-1px);
    }

    .container {
        width: 100%;
        max-width: 1000px;
        margin: 38px auto;
        padding: 0 20px;
    }

    .card {
        background: #ffffff;
        padding: 36px;
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 12px 36px rgba(24, 49, 83, 0.08);
    }

    .title {
        margin-bottom: 8px;
        color: var(--navy);
        font-size: 29px;
        line-height: 1.3;
    }

    .description {
        color: var(--muted);
        margin-bottom: 30px;
        font-size: 15px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    .full {
        grid-column: 1 / -1;
    }

    label {
        font-weight: 700;
        margin-bottom: 8px;
        color: #293b52;
        font-size: 14px;
    }

    input,
    select,
    textarea {
        display: block;
        width: 100%;
        min-width: 0;
        padding: 13px 14px;
        border: 1px solid #ccd7e5;
        border-radius: 10px;
        background: #fff;
        color: var(--text);
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder,
    textarea::placeholder {
        color: #94a1b2;
    }

    input:focus,
    select:focus,
    textarea:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.12);
    }

    textarea {
        min-height: 110px;
        resize: vertical;
    }

    .imei-note {
        color: var(--muted);
        font-size: 12px;
        margin-top: 6px;
    }

    .buttons {
        display: flex;
        gap: 14px;
        margin-top: 30px;
        align-items: center;
    }

    .btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 47px;
        border: none;
        padding: 13px 24px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
        transition: background 0.2s, transform 0.2s;
    }

    .save {
        background: var(--blue);
        color: white;
        flex: 1;
    }

    .save:hover {
        background: var(--blue-dark);
        transform: translateY(-1px);
    }

    .cancel {
        background: #edf1f6;
        color: #334155;
        border: 1px solid #dbe3ed;
    }

    .cancel:hover {
        background: #e0e7ef;
    }

    footer {
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        margin: 35px 20px 24px;
    }

    @media (max-width: 650px) {
        .navbar {
            padding: 16px 20px;
        }

        .navbar h2 {
            font-size: 18px;
        }

        .container {
            margin: 24px auto;
            padding: 0 14px;
        }

        .card {
            padding: 25px 19px;
            border-radius: 14px;
        }

        .title {
            font-size: 25px;
        }

        .form-grid {
            grid-template-columns: minmax(0, 1fr);
            gap: 18px;
        }

        .full {
            grid-column: 1;
        }

        .buttons {
            flex-direction: column-reverse;
            align-items: stretch;
        }

        .btn {
            width: 100%;
        }
    }
</style>

</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <h2>📱 Stolen Phone System</h2>

        <a href="{{ url_for('dashboard') }}" class="back">
            ← Dashboard
        </a>
    </div>


    <!-- CONTENT -->
    <div class="container">

        <div class="card">

            <h1 class="title">Register Phone</h1>

            <p class="description">
                Register mobile phone and owner information in the system.
            </p>
            {% if error %}
    <div class="message error" role="alert">
        {{ error }}
    </div>
{% endif %}

{% if success %}
    <div class="message success" role="status">
        {{ success }}
    </div>
{% endif %}


            <form method="POST" action="#">

                <div class="form-grid">

                    <!-- OWNER -->
                    <div class="form-group">
                        <label for="owner_name">
                            Owner Full Name
                        </label>

                        <input
                            type="text"
                            id="owner_name"
                            name="owner_name"
                            placeholder="Enter owner's full name"
                            required
                        >
                    </div>


                    <!-- PHONE NUMBER -->
                    <div class="form-group">
                        <label for="phone_number">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone_number"
                            name="phone_number"
                            placeholder="e.g. 0912345678"
                            required
                        >
                    </div>


                    <!-- IMEI 1 -->
                    <div class="form-group">
                        <label for="imei1">
                            IMEI 1
                        </label>

                        <input
                            type="text"
                            id="imei1"
                            name="imei1"
                            placeholder="Enter 15-digit IMEI"
                            maxlength="15"
                            pattern="[0-9]{15}"
                            required
                        >

                        <span class="imei-note">
                            IMEI must contain 15 digits.
                        </span>
                    </div>


                    <!-- IMEI 2 -->
                    <div class="form-group">
                        <label for="imei2">
                            IMEI 2
                        </label>

                        <input
                            type="text"
                            id="imei2"
                            name="imei2"
                            placeholder="Enter second IMEI if available"
                            maxlength="15"
                            pattern="[0-9]{15}"
                        >

                        <span class="imei-note">
                            Optional for dual-SIM phones.
                        </span>
                    </div>


                    <!-- BRAND -->
                    <div class="form-group">
                        <label for="brand">
                            Phone Brand
                        </label>

                        <select id="brand" name="brand" required>
                            <option value="">Select brand</option>
                            <option value="Samsung">Samsung</option>
                            <option value="Apple">Apple</option>
                            <option value="Tecno">Tecno</option>
                            <option value="Infinix">Infinix</option>
                            <option value="Xiaomi">Xiaomi</option>
                            <option value="Huawei">Huawei</option>
                            <option value="Nokia">Nokia</option>
                            <option value="Oppo">Oppo</option>
                            <option value="Vivo">Vivo</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>


                    <!-- MODEL -->
                    <div class="form-group">
                        <label for="model">
                            Phone Model
                        </label>

                        <input
                            type="text"
                            id="model"
                            name="model"
                            placeholder="e.g. Samsung Galaxy A32"
                            required
                        >
                    </div>


                    <!-- COLOR -->
                    <div class="form-group">
                        <label for="color">
                            Phone Color
                        </label>

                        <input
                            type="text"
                            id="color"
                            name="color"
                            placeholder="e.g. Black"
                        >
                    </div>


                    <!-- REGISTRATION DATE -->
                    <div class="form-group">
                        <label for="registration_date">
                            Registration Date
                        </label>

                        <input
                            type="date"
                            id="registration_date"
                            name="registration_date"
                        >
                    </div>


                    <!-- DESCRIPTION -->
                    <div class="form-group full">
                        <label for="description">
                            Additional Description
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            placeholder="Enter additional phone information..."
                        ></textarea>
                    </div>

                </div>


                <!-- BUTTONS -->
                <div class="buttons">

                    <a
                        href="{{ url_for('dashboard') }}"
                        class="btn cancel"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn save"
                    >
                        Register Phone
                    </button>

                </div>

            </form>

        </div>

    </div>


    <footer>
        © 2026 Stolen Phone Recording System
    </footer>

</body>
</html>
